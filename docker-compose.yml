volumes:
  pg_data:
  static:
  media:
services:
  db:
    image: postgres:13
    env_file:
      - ./.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    command:
      - /bin/sh
      - -c
      - python manage.py migrate && python manage.py collectstatic --noinput  && exec gunicorn --bind 0.0.0.0:8000 weblarek.wsgi:application
    volumes:
      - static:/app/collected_static
      - media:/app/media
    expose:
      - "8000"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    depends_on:
      - backend

    ports:
      - "80:80"

    volumes:
      - static:/var/html/static:ro
      - media:/var/html/media:ro
